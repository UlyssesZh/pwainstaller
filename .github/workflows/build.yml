name: Build

on:
  push:
    branches: [master]
    tags: ['v*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          # Gradle 8.13 requires a supported JVM; keep the project's JDK 21 LTS.
          java-version: '21'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'

      - name: Build
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Sign
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing_key="$(mktemp "$RUNNER_TEMP/signing-key.XXXXXX.jks")"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$signing_key"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" sign \
            --alignment-preserved \
            --ks "$signing_key" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$build_tools/apksigner" verify --verbose app-release.apk

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app-release.apk
          if-no-files-found: error

  push:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: publish-apk
      cancel-in-progress: false
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      - name: Push
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: apk
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/app-release.apk
